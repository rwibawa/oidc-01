spring:
  datasource:
    url: ${DEV_DATABASE_URL:jdbc:h2:file:./data/oidc}
    username: sa
    password: ${DEV_DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false   # Fixes connection issues if you are using Spring Security
